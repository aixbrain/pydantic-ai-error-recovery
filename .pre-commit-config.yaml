repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Ruff comes from the project environment, not a separately pinned mirror, so a
  # hook and `make lint` cannot reach different verdicts.
  - repo: local
    hooks:
      # ruff formats the Python code blocks inside markdown, so the docs are held
      # to the same style as the source. `ruff check` has no such support -- it
      # reports "no Python files found" and exits 0 -- so it stays Python-only.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, markdown]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

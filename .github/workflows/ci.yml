name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Validate the lockfile against pyproject.toml instead of installing it blindly,
# so drift fails the job rather than quietly changing what is tested.
env:
  UV_LOCKED: '1'

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history, not the working tree
          persist-credentials: false

      - run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --redact --no-banner

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-extras

      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright

      # The threshold is spelled out here rather than read from pyproject.toml,
      # so lowering it locally cannot also lower it for the branch.
      - run: uv run coverage run -m pytest
      - run: uv run coverage report --fail-under=100

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Depend on pydantic-ai-slim with an upper bound, never the meta package
      # pydantic-ai. Capabilities build on interfaces without a stability
      # promise; an unbounded pin lets a breaking major arrive silently.
      - name: Dependency policy
        run: |
          python3 - <<'EOF'
          import tomllib, pathlib, re
          deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          names = {re.split(r'[<>=!~;\[ @]', d, 1)[0].strip().lower() for d in deps}
          assert 'pydantic-ai-slim' in names, 'must depend on pydantic-ai-slim'
          assert 'pydantic-ai' not in names, 'must not depend on the meta package pydantic-ai'
          slim = next(d for d in deps if re.split(r'[<>=!~;\[ @]', d, 1)[0].strip().lower() == 'pydantic-ai-slim')
          assert re.search(r'<|~=|==', slim), 'pydantic-ai-slim must declare an upper bound (e.g. >=2.16,<3)'
          EOF

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv build
      - run: uvx twine check dist/*

      # Without the PEP 561 marker the wheel silently drops every annotation for
      # users, and a source checkout never shows it: the file is always there.
      - name: py.typed ships with the wheel
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          assert any(n.endswith('py.typed') for n in names), names
          EOF
